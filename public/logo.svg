<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1923;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#080c14;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="valRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4655;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e11d48;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Hexagonal Tactical Badge -->
  <polygon points="256,24 464,120 464,392 256,488 48,392 48,120" fill="url(#bgGrad)" stroke="url(#valRed)" stroke-width="12" />

  <!-- Inner Cyber Lines -->
  <polygon points="256,64 424,144 424,368 256,448 88,368 88,144" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Center Tactical V / Spike Worth Emblem -->
  <path d="M160,160 L220,160 L256,300 L292,160 L352,160 L280,360 L232,360 Z" fill="url(#valRed)" />
  <polygon points="256,120 276,170 236,170" fill="url(#cyanGlow)" />
  <polygon points="256,380 276,430 236,430" fill="url(#cyanGlow)" />
</svg>
